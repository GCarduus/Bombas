 g.fillStyle='#0006';rr(x+4,y+5,w,44,10);g.fill();g.fillStyle=s?'#ffd23f':'#34238a';rr(x,y,w,44,10);g.fill();g.lineWidth=3;g.strokeStyle=s?'#fff':'#6a52e0';g.stroke();
 tx(o[0],360,y+23,20,s?'#2a1450':'#fff');if(o[2]&&s){tx('◄',x+24,y+23,20,'#2a1450');tx('►',x+w-24,y+23,20,'#2a1450')}})}
function overlay(){g.fillStyle='#000b';g.fillRect(0,0,720,672);
 if(sc=='pause'){tx('PAUSA',360,200,56,'#ffd23f',0,'#1a0b45')}
 else if(res){tx(res.t,360,70,50,'#ffd23f',0,'#1a0b45');const t=performance.now()/1000;if(res.w)chr(res.w.sk,360,150,t,{win:1});else chr(P[0].sk,360,150,t,{lose:1});
  tx('Tempo de partida: '+F(tm/60)+':'+String(F(tm)%60).padStart(2,'0'),360,205,18,'#fff');
  P.forEach((p,i)=>{const y=250+i*38;g.fillStyle=p.al?'#ffffff22':'#ffffff0d';rr(110,y-16,500,32,8);g.fill();tx(p.name,126,y,16,PC[p.id],'left');tx(`Pontos ${p.score}   Elim. ${p.k}   Bombas ${p.pb}   Blocos ${p.bk}   ${p.al?'VENCEU':'saiu aos '+F(p.td)+'s'}`,596,y,13,'#fff','right')})}
 drawRows()}
function draw(){if(sc=='game'||sc=='pause'||sc=='end')drawGame();else drawBg();if(sc=='pause'||sc=='end')overlay();else if(sc!='game')scene();
 if(fade>0){g.fillStyle=`rgba(14,8,40,${fade})`;g.fillRect(0,0,720,672)}}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 try{if(sc=='game')step(dt);else if(sc=='end')ups(dt);else if(sc!='pause')bgStep(dt);music(dt);draw()}catch(e){console.error(e)}
 fade=Math.max(0,fade-dt*3);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
